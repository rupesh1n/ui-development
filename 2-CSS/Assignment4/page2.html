<!DOCTYPE html>
<html>
    <head>
        <title> CSS  Assignment - 2 page - 2</title>
        <link rel="stylesheet" href="../3-external-css/icon/css/all.css"/>
        <style>
            body{
                background-color: lightgray;
            }
            #container{
                width: 80%;
                padding: 50px 100px 50px;
                min-height: 450px;
                display: grid;
                grid-template-columns: auto auto;
                text-align: center;
                
            }
            #left{
                background-color: white;
                box-shadow: 2px 2px 5px gray;
                padding-top: 30px;
                border-radius: 10px 0px 0px 10px ;
                
            }
            #right{
                background-color:cadetblue;
                box-shadow: 2px 2px 5px gray;
                padding-top: 150px;
                border-radius: 0px 10px 10px 0px ;
            }
            .row{
                padding: 10px;
            }
            h1{
                font-size: 32px;
            }
            i{
                padding: 15px;
                width: 20px;
                height: 20px;
                border:1px solid cadetblue;
                border-radius: 50%;
            }
            a{
                text-decoration: none;
                color: rgb(70, 67, 67);
            }
            input{
                padding: 8px;
                width: 300px;
                background-color: rgb(233, 232, 232);
                border: none;
            }
            .buttoncyan{ 
                background-color: cadetblue;
                color: white;
                border: 1px solid rgb(12, 81, 84);
                padding: 10px;
                width: 150px;
                border-radius: 20px;
            }
            .buttonwhite{ 
                background-color: cadetblue;
                color: white;
                border: 1px solid white;
                padding: 10px;
                width: 150px;
                border-radius: 20px;
            }
            .white{
                color: white;
            }
            .whitedim{
                color: rgb(217, 227, 235);
            }

        </style>
    </head>
    <body>
        <section id="container">
            <div id="left">
                <div class="row">
                    <h1> Sign in</h1>
                </div>
                <div class="row">
                    <i class="fa-brands fa-facebook-f fa-brands 2px"></i>
                    <i class="fa-brands fa-google-plus-g"></i>
                    <i class="fa-brands fa-linkedin-in"></i>
                </div>
                <div class="row">
                    <input type="text" placeholder="User Email"/> 
                </div>
                <div class="row">
                    <input type="password" placeholder="Password"/>
                </div>
                <div class="row">
                    <a href="abc.html"> Forget your password?</a>
                </div>
                <div class="row">
                    <button type="button" class="buttoncyan"> SIGN IN</button>
                </div>
               
            </div>
            <div id="right">
                <h1 class="white"> Sign Up</h1>
                <p class="whitedim"> Sign up here if you don't have account</p>
                <button type="button" class="buttonwhite"> SIGN UP</button>
            </div>
        </section>
        
    </body>
</html>
