<!DOCTYPE html>
<html>
    <head>
        <title> CSS ID Selector</title>
        <style>
            #one{
                background: red;
                padding: 40px;
                font-size: 50px;
                color: white;
                text-align: center;
                margin: 2%;
            }
            #two{
                background: pink;
                padding: 40px;
                font-size: 30px;
                text-align: center;
                margin: 2%;
                min-height: 400px;
            }
            #three{
                background: blue;
                color: white;
                padding: 30px;
                font-size: 30px;
                text-align: center;
                margin: 2%;
            }
        </style>
    </head>
    <body>
        <div id="one"> Block One </div>
        <div id="two"> Block Two </div>
        <div id="three"> Block Three </div>
    </body>
</html>
