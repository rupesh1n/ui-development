<!DOCTYPE html>
<html>
    <head>
        <title> CSS Display:flex</title>
        <style>
            h1{
                color: blue;
                text-align:center;
                font-size: 50px;
            }
            body{
                margin: 0px;
            }

            section{
                background-color: darkcyan;
                color: yellow;
                font-size: 40px;
                padding: 50px;
                display:flex;
                flex-wrap: wrap;
            }

            div{
                margin: 50px 40px 50px;
                padding: 40px;
                box-shadow: 0px 0px 5px white;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1> Display:flex </h1>

        <section>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
        </section>
    </body>
</html>
