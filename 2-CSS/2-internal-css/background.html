<!DOCTYPE html>
<html>
    <head>
        <title> Bacground </title>
        <style>
            div{
                height: 250px;
                width: 20%;
                margin: 2%;
                float: left;
            }
            #bg1{background: red;}
            #bg2{background-color: green;}
            #bg3{background-color: rgb(200, 150,150);}
            #bg4{background-color: rgb(200, 150,150, 0.5);}
            #bg5{background-image:url(1.jpeg); background-size: 100% 100%;}
            #bg6{background-image: linear-gradient(red, blue);}
            #bg7{background-image: linear-gradient(to left, red, blue);}
            #bg8{background-image: linear-gradient(to right, red, blue);}
            #bg9{background-image: linear-gradient(to top, red, blue);}
</style>
    </head>
    <body>
        <div id="bg1"></div>
        <div id="bg2"></div>
        <div id="bg3"></div>
        <div id="bg4"></div>
        <div id="bg5"></div>
        <div id="bg6"></div>
        <div id="bg7"></div>
        <div id="bg8"></div>
        <div id="bg9"></div>
    </body>
</html>
