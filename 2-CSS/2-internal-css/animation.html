<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes homebanner{
                25%{ background-color:green; }
                50%{ background-color:blue; }
                75%{ background-color:purple; }
            }

            body{
                margin:0px;
                background-color:skyblue;
                color:white;
                font-size:100px;
                animation:homebanner;
                animation-duration:10s;
                animation-iteration-count:10;
            }


        </style>
    </head>
    <body>
        <h1> CSS Animation ... </h1>
    </body>
</html>
