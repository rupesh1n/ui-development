<!DOCTYPE html>
<html>
    <head>
        <title> CSS Attribute Selector</title>
        <style>

            input[type="text"]{
                height: 30px;
                width:300px;
                margin: 30px;
            }
            input[type="number"]{
                height: 30px;
                width:250px;
                margin: 30px;
            }
        </style>
    </head>
    <body>
        <h1> Attribute Selector </h1>
        <div>
            Full Name: <input type="text"/>
        </div>
        <div>
            Mobile No: <input type="number"/>
        </div>
    </body>
</html>
