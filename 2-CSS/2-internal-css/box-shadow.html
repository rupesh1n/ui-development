<!DOCTYPE html>
<html>
    <head>
        <title> CSS Box Shadow </title>
        <style>
            #one{
                width: 300px;
                height:300px;
                margin:50px;
                float:left;
                box-shadow: 0px 0px 5px gray;
            }
            #two{
                width: 300px;
                height:300px;
                margin:50px;
                float:left;
                background: skyblue;
                box-shadow: 0px 50px 20px black;
            }
            #three{
                width: 300px;
                height:300px;
                margin:50px;
                float:left;
                background: skyblue;
                box-shadow: 50px 50px 20px black;
            }
            #four{
                width: 300px;
                height:300px;
                margin:100px;
                float:left;
                background: skyblue;
                box-shadow: -50px -50px 20px black;
            }
        </style>
    </head>
    <body>
        <div id="one"></div>
        <div id="two"></div>
        <div id="three"></div>
        <div id="four"></div>
    </body>
</html>
