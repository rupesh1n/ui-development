<!DOCTYPE html>
<html>
    <head>
        <title> CSS Display:grid</title>
        <style>
            h1{
                color: blue;
                text-align:center;
                font-size: 50px;
            }
            body{
                margin: 0px;
            }

            section{
                background-color: darkcyan;
                color: yellow;
                font-size: 40px;
                padding: 50px;
                display:grid;
                grid-template-columns: auto auto auto auto;
            }

            div{
                margin: 50px 40px 50px;
            }
        </style>
    </head>
    <body>
        <h1> Display:grid </h1>

        <section>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
            <div> Banglore </div>
        </section>
    </body>
</html>
