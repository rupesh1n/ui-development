<!DOCTYPE html>
<html>
    <head>
        <title> CSS Border</title>
        <style>
            div{
                height: 250px;
                width: 16%;
                margin: 2%;
                float: left;
            }
            #bg1{border: 20px solid red;}
            #bg2{border: 20px dotted green;}
            #bg3{border: 20px dashed orange;}
            #bg4{border: 20px double blue;}
            #bg5{border: 20px inset goldenrod;}
            #bg6{border: 20px outset purple;}
            #bg7{border: 20px ridge red;}
            #bg8{border: 20px groove orange;}
        </style>
    </head>
    <body>
        <div id="bg1"></div>
        <div id="bg2"></div>
        <div id="bg3"></div>
        <div id="bg4"></div>
        <div id="bg5"></div>
        <div id="bg6"></div>
        <div id="bg7"></div>
        <div id="bg8"></div>
    </body>
</html>
