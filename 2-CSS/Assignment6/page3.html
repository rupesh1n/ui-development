<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../3-external-css/icon/css/all.css"/>
        <style>
            body{
                margin: 0px;
            }
            #container{
                display: grid;
                grid-template-columns: 50% 50%;
            }
            aside{
                background-color: #0db8a8;
                text-align: center;
                padding: 300px 232px 300px;
                color: white;
            }
            h1{
                font-size: 36px;
            }
            button{
                background-color: #0db8a8;
                color: #8fedf0;
                padding: 10px;
                width: 180px;
                border-radius: 30px;
                margin-top: 10px;
            }
            .asidebutton{
                border: 1px solid #8fedf0;
            }
            .light{
                color: #8fedf0;
            }
            .deepcyan{ color: #0db8a8;}
            .lightgray{ color: #d5d5d5;}


            #right{
                text-align: center;
                padding: 120px 70px 120px;
            }
            #sosal i{
                padding: 10px;
                width: 20px;
                height: 20px;
                margin-right: 10px;
                border: 1px solid lightgray;
                border-radius: 50%;
            }
            .signup{
                border: none;
            }
            .row{
                padding: 10px;
            }



            input{
                width: 350px;
                height: 30px;
                border: none;
                background-color: #ecf8ea;
            }
            .input-icons {
                width: 100%;
                margin-bottom: 20px;
            }

            .input-icons i {
                position: absolute;
            }

            .icon {
                padding: 10px;
                color: #6b716f;
                min-width: 50px;
                text-align: center;
            }

            .input-field {
                width: 60%;
                padding: 0px 50px 10px;
            }


        </style>
    </head>
    <body>
        <section id="container">
            <aside>
                <h1> Welcome Friend </h1>
                <p class="light"> To keep connected with us please login with your personal info.

                </p>
                <div>
                    <button type="button" class="asidebutton"> SIGN IN </button>
                </div>
            </aside>
            <section id="right">
                <h1 class="deepcyan"> Create Account </h1>
                <div id="sosal">
                    <i class="fa-brands fa-facebook-f fa-1x"></i>
                    <i class="fa-brands fa-twitter fa-1x"></i>
                    <i class="fa-brands fa-instagram fa-1x"></i>
                </div>
                <p class="lightgray"> or use your email for registration </p>
                
                <div class="input-icons">
                    <i class="fa fa-user icon"></i>
                    <input class="input-field" type="text" placeholder="Name">
                </div>
        
                <div class="input-icons">
                    <i class="fa fa-envelope icon"></i>
                    <input class="input-field" type="text" placeholder="Email">
                </div>
        
                <div class="input-icons">
                    <i class="fa fa-lock icon"></i>
                    <input class="input-field" type="password" placeholder="Password">
                </div>

                <div>
                    <button type="button" class="signup"> SIGN UP </button>
                </div>
            </section>
            

        </section>
    </body>
</html>
