<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                margin: 0px;
                background-color: #83ddf1;
            }
            #top{
                display: grid;
                grid-template-columns: 95% 5%;
                width: 600px;
                margin: auto;
                margin-top: 30px;
            }
            aside{
                background-color: #2483f7;
                border-radius: 0px 5px 5px 0px;
            }
            #container{
                background-color: white;
                box-shadow: 0px 0px 5px black;
                border-radius: 5px 0px 0px 5px;
                padding: 30px 50px 30px;
            }
            h1{
                color: #2483f7;
            }
            .row{
                height:40px;
                display: grid;
                grid-template-rows:auto auto;
                margin-bottom: 15px;
                padding: 20px 0px 20px;
            }   
            .smallinput{
                height: 40px;
                background-color: #e6e6e6;
                border: none;
                margin-top: 10px;

            }
            .checkboxrow{
                padding: 20px 0px 20px;
                display: grid;
                grid-template-columns:5% 30% auto;
            }
            a{
                text-align: right;
            }
            label{
                color: #b3ada9;
            }
            .center{
                display: block;
                text-align: center;
            }
            input[type=checkbox]::before {
                background-color: #b3ada9;
                }
            button{
                background-color: #2483f7;
                color: white;
                width: 500px;
                padding: 10px;
                border: none;
                border-radius: 5px;
            }

        </style>
    </head>

    <body>
        <section id="top">
            <section id="container">
                <h1> ACCOUNT LOGIN</h1>
                <div class="row">
                    <label> USERNAME </label>
                    <input type="text" class="smallinput"/>
                </div>
                <div class="row">
                    <label> PASSWORD </label>
                    <input type="password" class="smallinput"/>
                </div>
                <div class="checkboxrow">
                    <input type="checkbox" id="remember" name="remember"  />
                    <label for="remember">Remember Me </label>
                    <a href="reset.html"> Forgot Password?</a>
                </div>

                <div class="center">
                    <button> LOG IN </button>
                </div>

            </section>
        
        <aside>

        </aside>
        </section>
    </body>
</html>
