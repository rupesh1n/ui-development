<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-image: url("background.jpg");
                padding: 30px;
                background-color: white;
            }
            #container{
                width: 400px;
                min-height: 400px;
                margin: auto;
                margin-top: 30px;
                background-color: white;
                padding: 30px 50px 30px;
                border-radius: 5px;
            }
            h1{
                padding: 30px 0px 30px;
            }
            .row{
                height:40px;
                margin-bottom: 15px;
            }   
            .smallinput{
                height: 40px;
                width: 400px;
                outline: 0;
                border-width: 0 0 2px;
                border-color: #cbcbcb;
            }
            textarea{
                height: 70px;
                width: 400px;
                outline: 0;
                border-width: 0 0 2px;
                border-color: #cbcbcb;
            }
            .center{
                text-align: center;
                margin-top: 20px;
            }
            button{
                
                background-image: linear-gradient(to right, #e02a8f, #ed5144);
                color: white;
                width: 160px;
                height: 40px;
                border: none;
                margin-top: 50px;
            }

        </style>


    </head>
    <body>
        <section id="container">
            <h1 class="center"> Contact Us</h1>
            <div class="row">
                <input type="text" class="smallinput" placeholder="NAME"/>
            </div>
            <div class="row">
                <input type="email" class="smallinput" placeholder="EMAIL"/>
            </div>
            <div class="row">
                <textarea placeholder="MESSAGE"></textarea>
            </div>

            <div class="center">
                <button> Send Your Message </button>
            </div>

        </section>
    </body>
</html>
