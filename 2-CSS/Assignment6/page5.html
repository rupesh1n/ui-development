<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                margin: 0px;
                background-color: #01bdd6;
            }
            #container{
                width: 300px;
                min-height: 450px;
                margin: auto;
                margin-top: 30px;
                background-color: white;
                border-radius: 100px 0px 100px 0px;
                padding: 30px 50px 30px;
            }
            h1{
                color: #01bdd6;
                padding: 30px 0px 30px;
            }
            .row{
                height:40px;
                margin-bottom: 15px;
            }   
            .smallinput{
                height: 40px;
                width: 300px;
                outline: 0;
                border-width: 0 0 2px;
                border-color: #cbcbcb;

            }
           
            label{
                color: #b3ada9;
            }
            .center{
                text-align: center;
                margin-top: 20px;
            }
            button{
                background-color: #01bdd6;
                color: white;
                width: 300px;
                height: 40px;
                border: none;
                border-radius: 30px;
                margin-top: 10px;
            }
            a{
                text-decoration: none;
                color:  #01bdd6;
            }

        </style>
    </head>

    <body>
        <section id="container">
            <h1 class="center"> Welcome Back</h1>
            <div class="row">
                <input type="text" class="smallinput" placeholder="Username"/>
            </div>
            <div class="row">
                <input type="password" class="smallinput" placeholder="Password"/>
            </div>
            <div class="checkboxrow">
                <input type="checkbox" id="remember" name="remember"  />
                <label for="remember">Remember Me </label>
            </div>

            <div class="center">
                <button> LOG IN </button>
            </div>
            <div class="center">
                Don't have account? <a href="signup.html"> Sign up</a>
            </div>

        </section>
    </body>
</html>
