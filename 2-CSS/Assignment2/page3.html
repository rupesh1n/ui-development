<!DOCTYPE html>
<html>
    <head>
        <title> Css Assignment Set -2 Page - 3</title>
        <style>
            body{ margin: 0px;}
            p{
                padding: 20px;
            }
            #header{
                background-color: gold;
                height: 100px;
                margin-bottom: 10px;
            }
            footer{
                background-color: gold;
                height: 80px;
            }
            #container{
                display: grid;
                grid-template-columns: 20% 60% 20%;
            }
            aside, div {
                background-color: gold;
                height: 450px;
                margin-bottom: -5px;
            }
            div{
                margin-left: 10px;
                margin-right: 10px;
            }
        </style>
    </head>
    <body>
        <section id="header"> <p> Header </p> </section>

        <section id="container">
            <aside> <p> Nav </p></aside>
            <div> <p> Article </p></div>
            <aside> <p> Ads </p></aside>
        </section>

        <footer> <p> Footer </p></footer>
    </body>
</html>
