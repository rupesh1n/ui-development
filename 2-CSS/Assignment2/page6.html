<!DOCTYPE html>
<html>
    <head>
        <title> CSS Assignment - 2 Page 6</title>
        <style>
            h1, h3{
                color: rgb(96, 93, 93);
                text-align: center;
            }
            h3{
                margin-top: 50px;
            }
            hr{
                width:60%;
                color: rgb(96, 93, 93);
            }
            #container{
                width:60%;
                margin:auto;
                min-height: 400px;
                display: grid;
                grid-template-columns: auto auto;

            }
            .servicecustomer{
                margin: 30px;
                padding: 20px;
                
                text-align: center;
                box-shadow: 0px -5px 10px blue;
                border-radius: 20px;
            }
            .servicesales{
                margin: 30px;
                padding: 20px;
                
                text-align: center;
                box-shadow: 0px -5px 10px green;
                border-radius: 20px;
                
            }
            
            p{
                color: rgb(96, 93, 93);
                margin: 30px;
            }
            button{
                margin: 30px;
                padding: 10px;
                width: 200px;
                color: white;
                background-color: blue;
                border-radius: 50px;
                border: none;
            }
            
            a{
                text-decoration: none;
            }
            .servicesales button{
                background-color: forestgreen;
            }
            .servicesales a{
                color: forestgreen;
            }
            

        </style>
    </head>
    <body>
        <h1> Contact Us </h1>
        <hr/>
        <h3> Have any question? We'd love to hear from you</h3>
        <section id="container">
            
            <div class="servicecustomer">
                <h3> Customer Care </h3>
                <p>
                    Our support team is spread all over the world to give fast response.
                </p>
                <button type="button"> Submit a Request </button><br/>
                <a href="test.xml"> Frequently Asked Questions</a>
            </div>

            <div class="servicesales">
                <h3> Sales & Marketing </h3>
                <p>
                    Get in touch with our Sales & Marketing team to see how can work together.
                </p>
                <button type="button"> Contact Sales</button><br/>
                <a href="test.xml"> View Plans </a>
            </div>

        </section>
    </body>
</html>
