<!DOCTYPE html>
<html>
    <head>
        <title> CSS Assignment -1 page 6</title>
        <style>
          p{
            text-align: center;
            font-size: 24px;
          }
          #header, #navigation, footer, #container aside, #container div{
            border: 2px solid black;
            margin-bottom: 5px;
          }
          #container{
                display: grid;
                grid-template-columns:70% 30%;
                height: 450px;
          }
          div{
            margin-right: 5px;
          }
          aside p {
            padding-top:200px;
          }
          div p {
            padding-top:200px;
          }
        </style>
    </head>
    <body>
        <section id="header">
            <p> HEADER </p>
        </section>

        <section id="navigation">
            <p> NAVIGATION </p>
        </section>

        <section id="container">
            <div>
                <p> CONTENT</p>
            </div>

            <aside>
                <p> SIDEBAR </p>
            </aside>
        </section>

        <footer>
            <p> FOOTER </p>
        </footer>
        
    </body>
</html>
