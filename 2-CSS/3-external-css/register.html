        <header>
            <ul>
                <li> <a href="home.html"> <i class="fa fa-house"></i> Home </a> </li>

            </ul>
        </header>
        <section id="container">
            <fieldset>
                <legend> <i class="fa fa-user-plus"></i> Create Account</legend>
                <small> The * Marked fields are mandatory. </small>
                <div class="row">
                    <label>Full Name </label>
                    <input type="text" class="smallinput"/>
                </div>

                <div class="row">
                    <label>e-mail Id </label>
                    <input type="email" class="smallinput"/>
                </div>
                <div class="row">
                    <label> Password </label>
                    <input type="password" class="smallinput"/>
                </div>
                <div class="row">
                    <label>Mobile No </label>
                    <input type="number" class="smallinput"/>
                </div>

                <div class="row">
                    <label>Gender </label>
                    <div>
                        <input type="radio" name="gender" value="M"/> Male
                        <input type="radio" name="gender" value="F"/> Female
                    </div>
                </div>

                
                    <div class="row">
                        <label>Your City </label>
                        <select class="smallinput">
                            <option> Choose </option>
                            <option> Banglore </option>
                            <option> Mumbai </option>
                        </select>
                    </div>
               

                <div class="row">
                    <label>Full Adress </label>
                    <textarea class="biginput"></textarea>
                </div>

                <div class="center">
                    <button>Submit <i class="fa fa-arrow-right"></i></button>
                </div>
            </fieldset>
    </section>
