<!DOCTYPE html>
<html>
    <head>
        <script>
            const one = (photo) => {
                //alert(photo);
                document.getElementById("mypic").src = photo;
            }
        </script>
    </head>
    <body>
        <div align="center">
            <h1> How to change image using java Script </h1>
            <img src="1.jpg" height="400" width="600" id="mypic"/>

            <br/><br/>
            <img src="1.jpg" height="130" width="147" onclick="one('1.jpg')"/>
            <img src="2.jpg" height="130" width="147" onclick="one('2.jpg')"/>
            <img src="3.jpg" height="130" width="147" onclick="one('3.jpg')"/>
            <img src="4.jpg" height="130" width="147" onclick="one('4.jpg')"/>
        </div>
        
    </body>
</html>
