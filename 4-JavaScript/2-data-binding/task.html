<!DOCTYPE html>
<html>
    <head>
        <style>
            
            #container{
                width:500px;
                margin:auto;
                padding: 40px;
                box-shadow: 0px 0px 10px gray;
                display: grid;
                grid-template-columns: 50% 50%;
            }
            aside{
                margin-right: 10px;
            }
            aside p{
                padding-top: 200px;
            }
            #containercol{
                display: grid;
                grid-template-rows: auto auto;
                margin: 5px;
               
            }
            
        </style>
        <script>
            const one = () =>{
                let fullname = document.getElementById("myname").value;
                document.getElementById("showname").innerText = fullname;

                let mobile = document.getElementById("mymobile").value;
                document.getElementById("showmobile").innerText = mobile;
                
                let email = document.getElementById("myemail").value;
                document.getElementById("showemail").innerText = email;

                let skill = document.getElementById("myskill").value;
                document.getElementById("showskill").innerText = skill;

            }

        </script>
       
    </head>
    <body>
        <section id="container">
            <aside>
                <fieldset>
                    <legend> Enter Your Data</legend>
                    <table cellpading="20">
                        <tr>
                            <td>Name</td>
                            <td> <input type="text" id="myname"/></td>
                        </tr>
                        <tr>
                            <td> e-Mail</td>
                            <td> <input type="email" id="myemail"/></td>
                        </tr>
                        <tr>
                            <td> Mobile</td>
                            <td> <input type="number" id="mymobile"/></td>
                        </tr>
                        <tr>
                            <td> Skill</td>
                            <td> <textarea rows="4" cols="16" id="myskill" ></textarea></td>
                        </tr>
                        <tr align="center">
                            <td colspan="2" > <button onclick="one()">Process</button></td>
                        </tr>
                    </table>
                </fieldset>
            </aside>
                <div id="containercol">
                    <div>
                        <fieldset>
                            <legend> Personal Details</legend>
                        <table cellpading="20">
                            <tr>
                                <td>Name :</td>
                                <td> <label id="showname"></label></td>
                            </tr>
                            <tr>
                                <td> e-Mail Id :</td>
                                <td> <label id="showemail"></label></td>
                            </tr>
                            <tr>
                                <td> Mobile  No :</td>
                                <td> <label id="showmobile"></label></td>
                            </tr>
                        </table>
                    </fieldset>
                    </div>

                    <div id="skill">
                        <fieldset>
                            <legend> My Skill</legend>
                        <table cellpading="20">
                            <tr>
                                <td> <label id="showskill"></label></td>
                            </tr>
                        </table>
                    </fieldset>
                    </div>
                </div>
        </section>
    
    </body>
</html>
