<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css"/>
        <script>
            const gethome=()=>{
                fetch("home.html")
                .then(abc =>abc.text())
                .then(originalData =>{
                    document.getElementById("container").innerHTML = originalData;
                })
            }
            const getservice=()=>{
                fetch("service.html")
                .then(abc =>abc.text())
                .then(originalData =>{
                    document.getElementById("container").innerHTML = originalData;
                })
            }
            const getcity = ()=>{
                fetch("city.json")
                .then(abc => abc.json())
                .then(cityArray =>{
                    let data = "<h1> Branch List </h1>";
                    cityArray.map((cityName, index) =>{
                        data = data + `<div class='four'> ${cityName} </div>`;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }

            const getblog = ()=>{
                fetch("https://jsonplaceholder.typicode.com/posts")
                .then(abc =>abc.json())
                .then(blogArray =>{
                    let data = "<h1> Recent Blog </h1>";
                    blogArray.map((blog, index) => {
                        data = data + `<div class='two'>
                            <h3> ${blog.title}</h3>
                            <p> ${blog.body}</p></div>
                            `;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }
            const getcomments = ()=>{
                fetch("https://jsonplaceholder.typicode.com/comments")
                .then(abc =>abc.json())
                .then(blogArray =>{
                    let data = "<h1> Recent Comments </h1>";
                    blogArray.map((blog, index) => {
                        data = data + `<div class='three'>
                            <h3> ${blog.name}</h3>
                            <p> ${blog.email}</p>
                            <p> ${blog.body}</p></div>
                            `;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }

            const getgallery = ()=>{
                fetch("https://jsonplaceholder.typicode.com/photos")
                .then(abc =>abc.json())
                .then(blogArray =>{
                    let data = "<h1> Gallery </h1>";
                    blogArray.map((blog, index) => {
                        data = data + `<div class='one'>
                            <h3> ${blog.title}</h3>
                            <img src='${blog.thumbnailUrl}'> </img>
                            </div>
                            `;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }

            const gettodo = ()=>{
                fetch("https://jsonplaceholder.typicode.com/todos")
                .then(abc =>abc.json())
                .then(blogArray =>{
                    let data = "<h1> TODO </h1>";
                    blogArray.map((todo, index) => {
                        data = data + `<div class='six'>
                            <h3> ${todo.title}</h3>
                            <p>${todo.completed} </p>
                            </div>
                            `;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }
            const getusers = ()=>{
                fetch("https://jsonplaceholder.typicode.com/users")
                .then(abc =>abc.json())
                .then(blogArray =>{
                    let data = "<h1> Users Details </h1>";
                    blogArray.map((user, index) => {
                        data = data + `<div class='five'>
                            <h3> ${user.name}</h3>
                            <p> Email: ${user.email}</p>
                            <p> Address: ${user.address.street}<br/>
                                ${user.address.suite}, ${user.address.city}<br\>
                                Zipcode: ${user.address.zipcode} <br\><br\>
                                Phone: ${user.phone} <br\>
                                Website: ${user.website} <br\>
                                </p>
                            </div>
                            `;
                    })
                    document.getElementById("container").innerHTML = data;
                })
            }
        </script>
    </head>
    <body onload="gethome()">
        <header>
            <button onclick="gethome()"> Home</button>
            <button onclick="getservice()"> Our Service</button>
            <button onclick="getcity()"> Our Branches</button>
            <button onclick="getblog()"> Blogs </button>
            <button onclick="getcomments()"> Comments </button>
            <button onclick="getgallery()"> Gallery </button>
            <button onclick="gettodo()"> Todo </button>
            <button onclick="getusers()"> Users </button>
        </header>
        <section id="container">

        </section>
    </body>
</html>
