<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
        <link rel="stylesheet" href="../icon/css/all.css"/>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row mb-4">
                <div class="col-lg-12 text-center">
                    <h1 class="text-primary"><i class="fa fa-user-plus"></i> New Admission </h1>
                </div>
            </div><!-- row end-->

            <div class="row">
                <div class="col-xl-3"></div>
                <div class="col-xl-6">
                    <div class="card border-primary border-opacity-10">
                        <div class="card-header text-primary bg-primary bg-opacity-10">Student Details </div>
                        <div class="card-body">
                            <div class="mb-4">
                                <label class="fw-bold"> Student name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control mt-1"/>
                            </div>

                            <div class="mb-4 row">
                                <label class="fw-bold"> Date of birth <span class="text-danger">*</span></label>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Day"/> </div>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Month"/> </div>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Year"/> </div>
                            </div>

                            <div class="mb-4 row">
                                <label class="fw-bold"> Admission Class <span class="text-danger">*</span></label>
                                <div class="col-xl-6"> 
                                    <select class="form-select mt-1">
                                        <option> Choose </option>
                                        <option> Class-1 </option>
                                        <option> Class-2 </option>
                                        <option> Class-3 </option>
                                    </select>
                                </div>
                                <div class="col-xl-6"> 
                                    <select class="form-select mt-1">
                                        <option> Choose Section</option>
                                        <option> A </option>
                                        <option> B </option>
                                        <option> C </option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4 row">
                                <label class="fw-bold"> Date of Admission <span class="text-danger">*</span></label>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Day"/> </div>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Month"/> </div>
                                <div class="col-xl-4"> <input type="number" class="form-control" placeholder="Year"/> </div>
                            </div>

                            <div class="mb-4 row">
                                <label class="fw-bold"> Admission Session </label>
                                <div class="col-xl-12"> 
                                    <select class="form-select mt-1">
                                        <option> Choose </option>
                                        <option> 2024 </option>
                                        <option> 2025 </option>
                                        <option> 2026 </option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="fw-bold"> Old School </label>
                                <input type="text" class="form-control mt-1"/>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="col-xl-3"></div>
            </div><!-- row end-->
        </div>

    </body>
</html>
