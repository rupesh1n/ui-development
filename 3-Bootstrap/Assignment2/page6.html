<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
        <link rel="stylesheet" href="../icon/css/all.css"/>
        <style>
            body{
                background-color: rgb(245, 242, 242);
            }
        </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row">
                <div class="col-lg-12 text-center text-primary">
                    <h3>Enter Your Register Mobile No. in Infocampus</h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 text-center text-danger">
                    <p>Please Enter Your 10 digits Valid Mobile No !</p>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-lg-4"></div>
                <div class="col-lg-3">
                    <input type="number" class="form-control" placeholder="Enter 10 digits mobile no"/>
                </div>
                <div class="col-lg-2"><button class="btn btn-primary"> <i class="fa fa-user-plus"></i> Register</button></div>
                <div class="col-lg-3"></div>
            </div>

            <div class="row">
                <div class="col-lg-12 text-center text-primary">
                    <p>Already Registered! Go to Login</p>
                </div>
            </div>

        </div>

    </body>
</html>
