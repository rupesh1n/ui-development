<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row mb-4">
                <div class="col-lg-12 text-center">
                    <h4> REGISTER AS CANDIDATE </h4>
                    <hr/>
                </div>
            </div><!-- row end-->

            <div class="row">
                <div class="col-xl-12">

                    <div class="mb-4 row">
                        <div class="col-xl-3"> First Name : </div>
                        <div class="col-xl-9"> <input type="text" class="form-control"/> </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Last Name : </div>
                        <div class="col-xl-9"> <input type="text" class="form-control"/> </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Mobile No : </div>
                        <div class="col-xl-9"> <input type="number" class="form-control"/> </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Email Id : </div>
                        <div class="col-xl-9"> <input type="email" class="form-control"/> </div>
                    </div>
                    <div class="mb-4 row">
                        <div class="col-xl-3"> Password : </div>
                        <div class="col-xl-9"> <input type="password" class="form-control" placeholder="Password max 8 character"/> </div>
                    </div>
                    <div class="mb-4 row">
                        <div class="col-xl-3"> Confirm Password : </div>
                        <div class="col-xl-9"> <input type="password" class="form-control" placeholder="Confirm Password max 8 character"/> </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Date Of Birth :</div>
                        <div class="col-xl-3"> <input type="number" class="form-control" placeholder="Day"/> </div>
                        <div class="col-xl-3"> <input type="number" class="form-control" placeholder="Month"/> </div>
                        <div class="col-xl-3"> <input type="number" class="form-control" placeholder="Year"/> </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Full Address : </div>
                        <div class="col-xl-9"> <textarea class="form-control"></textarea></div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> Pincode : </div>
                        <div class="col-xl-9"> <input type="number" class="form-control"/> </div>
                    </div>
                    <div class="mb-4 row">
                        <div class="col-xl-3"> State : </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose State </option>
                                <option> Karnataka </option>
                                <option> Bihar </option>
                                <option> Delhi </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"> District : </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose District </option>
                                <option> Banglore </option>
                                <option> Patna </option>
                                <option> Delhi </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4 row">
                        <div class="col-xl-3"></div>
                        <div class="col-xl-9">
                            <input class="form-check-input" type="checkbox" value="">
                            <label class="form-check-label text-primary" for="flexCheckDefault">
                                Agree On Terms Condition
                              </label>
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="btn btn-primary me-4"> Register </button>
                        <button class="btn btn-primary"> Clear </button>
                    </div>

                    
                </div>
            </div><!-- row end-->
        </div>

    </body>
</html>
