<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row">
                <div class="col-xl-2"></div>
                <div class="col-xl-8">
                    <div class="card">
                        <div class="card-header">Parent Details</div>
                        <div class="card-body">
                            <div class="mb-4 row">
                                <div class="col-xl-2 fw-bold"> Father name <span class="text-danger">*</span> </div>
                                <div class="col-xl-4"> <input type="text" class="form-control"/> </div>
                                <div class="col-xl-2 fw-bold"> Mother Name </div>
                                <div class="col-xl-4"> <input type="text" class="form-control"/> </div>
                            </div>

                            <div class="mb-4 row">
                                <div class="col-xl-2 fw-bold"> Mobile No <span class="text-danger">*</span> </div>
                                <div class="col-xl-4"> <input type="number" class="form-control"/> </div>
                                <div class="col-xl-2 fw-bold"> Adhar No </div>
                                <div class="col-xl-4"> <input type="number" class="form-control"/> </div>
                            </div>

                            <div class="mb-4 row">
                                <div class="col-xl-2 fw-bold"> Religion </div>
                                <div class="col-xl-4"> <input type="text" class="form-control"/> </div>
                                <div class="col-xl-2 fw-bold"> Caste </div>
                                <div class="col-xl-4">
                                    <select class="form-select mt-1">
                                        <option> Choose </option>
                                        <option> Class-1 </option>
                                        <option> Class-2 </option>
                                        <option> Class-3 </option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4 row">
                                <div class="col-xl-6"> 
                                    <label class="fw-bold mb-1">Parent Occupation</label>
                                    <input type="number" class="form-control"/> 
                                </div>
                                <div class="col-xl-6"> 
                                    <label class="fw-bold mb-1">Any  Id Proof No</label>
                                    <input type="number" class="form-control"/>
                                </div>
                            </div>

                            <div class="mb-4 row">
                                <div class="col-xl-12"> 
                                    <label class="fw-bold mb-1">Address <span class="text-danger">*</span></label>
                                    <textarea class="form-control mt-1"></textarea>
                                </div>
                            </div>

                            <div class="text-center">
                                <button class="btn btn-primary me-4"> Register </button>
                                <button class="btn btn-warning text-white"> Clear All </button>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="col-xl-2"></div>
            </div>
        </div>
    </body>
</html>
