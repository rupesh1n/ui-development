<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row mb-4">
                <div class="col-lg-12">
                    <h5> SCHOOL DETAILS </h5>
                </div>
            </div><!-- row end-->

            <div class="row">
                <div class="col-xl-6">

                    <div class="mb-3 row">
                        <div class="col-xl-3"> School Name </div>
                        <div class="col-xl-9"> <input type="text" class="form-control" placeholder="Enter name"/> </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3"> Last Name </div>
                        <div class="col-xl-9"> <textarea class="form-control" placeholder="Enter Address"></textarea> </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3"> Pincode </div>
                        <div class="col-xl-9"> <input type="number" class="form-control" placeholder="Enter Pincode"/> </div>
                    </div>
 
                </div>

                
                <div class="col-xl-6">

                    <div class="mb-3 row">
                        <div class="col-xl-3"> State </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose State </option>
                                <option> Bihar </option>
                                <option> Karnataka </option>
                                <option> Delhi </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3">Distict </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose Distict </option>
                                <option> Class-1 </option>
                                <option> Class-2 </option>
                                <option> Class-3 </option>
                            </select>
                        </div>
                    </div>
                    
                </div>

            </div><!-- row end-->

            <div class="row">
                <div class="col-xl-6">

                    <div class="mb-3 row">
                        <div class="col-xl-3"> School Phone </div>
                        <div class="col-xl-9"> <input type="number" class="form-control" placeholder="Enter Phone"/> </div>
                    </div>
                    

                    <div class="mb-3 row">
                        <div class="col-xl-3"> School Grade </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose Grade </option>
                                <option> A </option>
                                <option> B </option>
                                <option> C </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3"> School Syllabus </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Choose School Syllabus </option>
                                <option> Class-1 </option>
                                <option> Class-2 </option>
                                <option> Class-3 </option>
                            </select>
                        </div>
                    </div>
 
                </div>

                
                <div class="col-xl-6">

                    <div class="mb-3 row">
                        <div class="mb-3 row">
                            <div class="col-xl-3"></div>
                            <div class="col-xl-9"></div>
                        </div>
    
                        <div class="mb-3 row">
                            <div class="col-xl-3"> School Email ID </div>
                            <div class="col-xl-9"> <input type="email" class="form-control" placeholder="Enter email"/></div>
                        </div>
    
                        <div class="mb-3 row">
                            <div class="col-xl-3"> Password </div>
                            <div class="col-xl-9"> <input type="password" class="form-control" placeholder="Enter password"/> </div>
                        </div>
    
                        <div class="mb-3 row">
                            <div class="col-xl-3"> Confirm Password</div>
                            <div class="col-xl-9"> <input type="password" class="form-control" placeholder="Enter password again"/> </div>
                        </div>
                    
                </div>

            </div><!-- row end-->

            <div class="row mb-4">
                <div class="col-lg-12">
                    <h5> REGISTRIANT DETAILS </h5>
                </div>
            </div><!-- row end-->


            <div class="row">
                <div class="col-xl-6">

                    <div class="mb-3 row">
                        <div class="col-xl-3"> Name </div>
                        <div class="col-xl-9"> <input type="text" class="form-control" placeholder="Enter Registriant name"/> </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3"> Mobile </div>
                        <div class="col-xl-9"> <input type="number" class="form-control" placeholder="Enter Registriant Phone number"/> </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-2"></div>
                        <div class="col-xl-10">
                            <input class="form-check-input" type="checkbox" value="">
                            <label class="form-check-label text-primary" for="flexCheckDefault">
                                Agree On Terms Condition
                              </label>
                        </div>
                    </div>
 
                </div>

                
                <div class="col-xl-6">
                    <div class="mb-3 row">
                        <div class="col-xl-3"> Email id </div>
                        <div class="col-xl-9"> <input type="email" class="form-control" placeholder="Enter Registriant Email id"/></div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-xl-3"> Designation </div>
                        <div class="col-xl-9">
                            <select class="form-select mt-1">
                                <option> Select Designation </option>
                                <option> Officer </option>
                                <option> Teacher </option>
                                <option> Officer </option>
                            </select>
                        </div>
                    </div>
                    
                </div>

                <div class="text-center">
                    <button class="btn btn-primary me-4"> Register </button>
                    <button class="btn btn-primary"> Reset </button>
                </div>

            </div><!-- row end-->

        </div>

    </body>
</html>
