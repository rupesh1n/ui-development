<!DOCTYPE html>
<html>
    <head>
       <link rel="stylesheet" href="../dist/css/bootstrap.css"/>
    </head>

    <body>
        <div class="container mt-3 mb-3">
            <div class="row">
                <div class="col-xl-8">
                    <h3 class="text-center mb-3"> New Employee </h3>
                    
                    <div class="mb-3">
                        <label class="fw-bold"> Emp Name </label>
                        <input type="text" class="form-control mt-1"/>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold"> Emp Mobile </label>
                        <input type="number" class="form-control mt-1"/>
                    </div>


                    <div class="mb-3">
                        <label class="fw-bold"> Emp E-mail </label>
                        <input type="email" class="form-control mt-1"/>
                    </div>


                    <div class="mb-3">
                        <label class="fw-bold"> Emp Salary </label>
                        <input type="number" class="form-control mt-1"/>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold"> Emp Dept </label>
                        <input type="text" class="form-control mt-1"/>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold"> Emp Joining Date </label>
                        <input type="text" class="form-control mt-1" placeholder="mm/dd/yyyy"/>
                    </div>

                    <div class="text-center">
                        <button class="btn btn-primary me-3"> Save Employee </button>
                        <button class="btn btn-danger"> Close </button>
                    </div>

                </div>
            </div>
        </div>
    </body>
</html>
