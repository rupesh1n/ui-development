<!DOCTYPE html>
<html>
    <head>
        <title> Form Example </title>
    </head>
    <body bgcolor="pink">
        <table align="center" cellpadding="15">
            <tr>
                <th> <a href="form1.html"> Contact Us </a> </th>
                <th> <a href="form2.html"> Login </a> </th>
                <th> <a href="form3.html"> Create Account </a> </th>
                <th> <a href="project.html"> My Project </a> </th>
            </tr>

        </table>
        <table align="center" cellpadding="10" background="12.jpg">
            <caption>
                <h1> Contact Us </h1>
            </caption>
            <tr>
                <th> Your Full Name </th>
                <td> <input type="text" placeholder="Enter your name" size="40"/> </td>
            </tr>

            <tr>
                <th> Your Email Id </th>
                <td> <input type="email" placeholder="Enter your email id" size="40"/> </td>
            </tr>

            <tr>
                <th> Your Mobile No.</th>
                <td> <input type="number" placeholder="Enter your mobile no." size="40"/> </td>
            </tr>

            <tr>
                <th> Your City Name</th>
                <td>
                    <select>
                        <option> ---------- Choose city ----------</option>
                        <option> Banglore </option>
                        <option> Mumbai </option>
                        <option> Chennai </option>
                        <option selected> Patna </option>
                        <option> Kolkata </option>
                    </select>
                </td>
            </tr>

            <tr>
                <th> Your Message </th>
                <td> <textarea cols="40" rows="10" maxlength="100"></textarea> <br/>
                    <small> Max 100 characters allowed</small>
                </td>
            </tr>

            <tr>
                <th colspan="2">
                    <button type="submit"> Send Message </button>
                    <button type="reset"> Reset </button>
                </th>
            </tr>
        </table>

    </body>
</html>
