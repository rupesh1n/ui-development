<!DOCTYPE html>
<html>

<head>
    <title> HTML Addignment - 5 - Page - 1</title>
</head>

<body bgcolor="#87ceea">
    <form action="abc.py" method="post">
        <table align="center" cellspacing="40" bgcolor="#90ee90">
            <caption>
                <h1> Contact Us</h1>
            </caption>
            <tr>
                <th> Name </th>
                <td> <input type="text" placeholder="Enter name" /> </td>
                <th> Mobile </th>
                <td> <input type="number" placeholder="Enter Mobile" /> </td>
            </tr>
            <tr>
                <th> City </th>
                <td>
                    <select>
                        <option> Choose City </option>
                        <option> Banglore </option>
                        <option> Kolkata </option>
                        <option> Patna </option>
                        <option> Rachi </option>
                    </select>
                </td>
                <th> Pincode </th>
                <td> <input type="number" placeholder="Enter Pincode" /> </td>
            </tr>
            <tr>
                <th> Messge </th>
                <td colspan="3"> <textarea rows="7" cols="55" placeholder="Enter Message"></textarea></td>
            </tr>
            <tr>
                <td colspan="4" align="center">
                    <button type="submit"> Submit </button>
                    <button type="reset"> Reset </button>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
