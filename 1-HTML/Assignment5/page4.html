<!DOCTYPE html>
<html>

<head>
    <title> HTML Addignment - 5 - Page - 4</title>
</head>

<body>
    <h1 align="center"> Add New Item</h2>
        <table align="center" cellpadding="10">
            <tr>
                <td><input type="text" placeholder="Item Name"/></td>
                <td><input type="text" placeholder="Item Price"/></td>
                <td><input type="text" placeholder="Item Qty"/></td>
                <td><button type="button"> Save </button></td>
            </tr>
        
        </table>
    <h2 align="center"> Item List</h2>
    <table align="center" cellpadding="12" cellspacing="0" width="90%" border="1" bordercolor="white">
        <thead>
            <tr bgcolor="skyblue" align="center">
                <th> Sl No </th>
                <th> Item Name </th>
                <th> Price </th>
                <th> Quantity </th>
                <th> Edit </th>
                <th> Delete </th>
            </tr>
        </thead>

        <tbody>
            <tr align="center">
                <td> 01 </td>
                <td> Apple </td>
                <td>Rs. 250/Kg </td>
                <td> 2Kg </td>
                <td> <button type="button"> Edit </button> </td>
                <td> <button type="button"> Delete </button> </td>
            </tr>
            <tr align="center">
                <td> 02 </td>
                <td> Mango </td>
                <td> Rs. 100/Kg </td>
                <td> 4Kg </td>
                <td> <button type="button"> Edit </button> </td>
                <td> <button type="button"> Delete </button> </td>
            </tr>
            <tr align="center">
                <td> 03 </td>
                <td> Orange </td>
                <td>Rs. 120/Kg </td>
                <td> 5Kg </td>
                <td> <button type="button"> Edit </button> </td>
                <td> <button type="button"> Delete </button> </td>
            </tr>
        </tbody>

        <tfoot>
            <tr bgcolor="pink" align="center">
                <th> Sl No </th>
                <th> Item Name </th>
                <th> Price </th>
                <th> Quantity </th>
                <th> Edit </th>
                <th> Delete </th>
            </tr>
        </tfoot>
    </table>
    <table align="center" cellpadding="10">
        <tr>
            <td><button type="button"> First </button></td>
            <td><button type="button"> 1 </button></td>
            <td><button type="button"> 2 </button></td>
            <td><button type="button"> 3 </button></td>
            <td><button type="button"> 4 </button></td>
            <td><button type="button"> 5 </button></td>
            <td><button type="button"> Last </button></td>
        </tr>
    
    </table>
</body>

</html>
